name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          if ($ref -like "refs/tags/v*") {
            $v = $ref.Substring("refs/tags/v".Length)
          } else {
            $v = "0.0.0-dev"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "building NeoFace-Setup-$v"

      - name: Build credential provider DLL
        shell: pwsh
        run: |
          # build_cp.ps1 uses relative source paths - must run from cp\
          Push-Location cp
          .\build_cp.ps1
          Pop-Location
          if (!(Test-Path cp\FaceUnlockCP.dll)) { throw "build_cp.ps1 did not produce cp\FaceUnlockCP.dll" }

      - name: Assemble dist (bundled Python runtime)
        shell: pwsh
        run: .\installer\build_dist.ps1 -DllPath cp\FaceUnlockCP.dll

      - name: Locate Inno Setup compiler
        id: iscc
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "ISCC not preinstalled - installing via winget"
            winget install --id JRSoftware.InnoSetup --silent --accept-package-agreements --accept-source-agreements
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found after install" }
          "path=$iscc" >> $env:GITHUB_OUTPUT

      - name: Compile installer
        shell: pwsh
        run: |
          & "${{ steps.iscc.outputs.path }}" /DMyAppVersion=${{ steps.ver.outputs.version }} installer\installer.iss
          $exe = Get-ChildItem installer\Output\NeoFace-Setup-*.exe | Select-Object -First 1
          if (-not $exe) { throw "ISCC reported success but produced no installer" }
          "setup: $($exe.Name) ($([math]::Round($exe.Length/1MB,1)) MB)"

      - name: Write release notes with checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer\Output\NeoFace-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $v = "${{ steps.ver.outputs.version }}"
          $body = @'
          ## NeoFace Unlock {{VER}}

          ### Install (no Python, no Git, no compiler needed)
          1. Download ``NeoFace-Setup-{{VER}}.exe`` below
          2. Run it (if SmartScreen warns, click "More info" > "Run anyway" - the installer is unsigned)
          3. Follow the setup wizard: Windows password once, then enroll your face
          4. Sign in with PIN, press **Win+L**, click the NeoFace tile, look at the camera

          Windows 10/11 x64. Face data and password stay on your PC.

          ### SHA256
          ````
          {{HASH}}
          ````
          '@
          $body = $body.Replace('{{VER}}', $v).Replace('{{HASH}}', $hash)
          # strip the here-string's leading indentation
          $body = ($body -split "`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          Set-Content -Path release_notes.md -Value $body -Encoding UTF8
          Get-Content release_notes.md

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NeoFace Unlock ${{ github.ref_name }}
          body_path: release_notes.md
          files: installer/Output/NeoFace-Setup-*.exe
          draft: false
          prerelease: false
