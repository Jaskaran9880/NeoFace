name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-dll:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build credential provider DLL
        shell: pwsh
        run: |
          # build_cp.ps1 uses relative source paths - must run from cp\
          Push-Location cp
          .\build_cp.ps1
          Pop-Location
          if (!(Test-Path cp\FaceUnlockCP.dll)) { throw "build_cp.ps1 did not produce cp\FaceUnlockCP.dll" }

      - uses: actions/upload-artifact@v4
        with:
          name: FaceUnlockCP-dll
          path: cp/FaceUnlockCP.dll
          retention-days: 7

  installer:
    needs: build-dll
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: FaceUnlockCP-dll
          path: cp

      - name: Assemble dist (bundled Python runtime)
        shell: pwsh
        run: .\installer\build_dist.ps1 -DllPath cp\FaceUnlockCP.dll

      - name: Locate Inno Setup compiler
        id: iscc
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "ISCC not preinstalled - installing via winget"
            winget install --id JRSoftware.InnoSetup --silent --accept-package-agreements --accept-source-agreements
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found after install" }
          "path=$iscc" >> $env:GITHUB_OUTPUT

      - name: Compile installer
        shell: pwsh
        run: |
          & "${{ steps.iscc.outputs.path }}" /DMyAppVersion=0.0.0-dev installer\installer.iss
          $exe = Get-ChildItem installer\Output\NeoFace-Setup-*.exe | Select-Object -First 1
          if (-not $exe) { throw "ISCC reported success but produced no installer" }
          "setup: $($exe.Name) ($([math]::Round($exe.Length/1MB,1)) MB)"

      - uses: actions/upload-artifact@v4
        with:
          name: NeoFace-Setup-dev
          path: installer/Output/NeoFace-Setup-*.exe
          retention-days: 7
