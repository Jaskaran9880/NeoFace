[engine]
backend = "fast"

[fast]
detector = "models/yunet.onnx"
recognizer = "models/sface.onnx"
image_size = 320
frames = 3
hit_required = 2

[match]
cosine_threshold = 0.35

[camera]
index = 0
width = 640
height = 480
fps = 30
codec = "MJPG"
backend = "DSHOW"
buffer_size = 1

[pipe]
name = "\\\\.\\pipe\\NeoFace"
max_instances = 1
buffer_size = 65536

[presence]
enabled = false
tick_seconds = 45
idle_timeout = 60
